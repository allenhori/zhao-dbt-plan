# Packages the `zhao-dbt-plan` binary as a platform wheel on PyPI, so it
# installs with `pip install zhao-dbt-plan` / `uv tool install zhao-dbt-plan`,
# the same way zhao-cli does. There's no Python code: maturin compiles the
# Rust binary and puts it on PATH as a console script. The version comes
# from Cargo.toml.

[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "zhao-dbt-plan"
dynamic = ["version"]
description = "Static microbatch cascading time-window planner for dbt -- a zhao-cli Addon."
readme = "README.md"
license = "AGPL-3.0-or-later"
keywords = ["dbt", "microbatch", "backfill", "data"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Rust",
  "Topic :: Database",
]

[project.urls]
Homepage = "https://github.com/allenhori/zhao-dbt-plan"
Repository = "https://github.com/allenhori/zhao-dbt-plan"
Changelog = "https://github.com/allenhori/zhao-dbt-plan/releases"

[tool.maturin]
bindings = "bin"
strip = true
